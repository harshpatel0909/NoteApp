name: Android CI (Code Check)

# Trigger this pipeline on pushes to dev or pull requests to main
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      # 1. Check formatting and styling (if using lint tools)
      - name: Run Code Quality Checks (Lint)
        run: ./gradlew lintDebug

      # 2. Run your Unit Tests
      - name: Run Local Unit Tests
        run: ./gradlew testDebugUnitTest

      # 3. Ensure the entire project builds successfully
      - name: Build Debug APK
        run: ./gradlew assembleDebug